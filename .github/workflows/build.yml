# Build ext4win.exe on a Windows runner, from pinned sources only.
#
# Two reasons this has to be a real CI build rather than something done on a
# maintainer's laptop:
#
#   1. SignPath will only sign a binary it can verify came from this
#      repository's trusted build system, so the build is the thing that
#      submits it (see CODE-SIGNING-POLICY.md).
#   2. Anyone receiving a GPL binary is entitled to the source it was built
#      from. A build pinned to commits makes that offer checkable rather than
#      aspirational.
#
# Nothing here resolves a version at build time. Every input is in
# build/pins.json.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pins
        shell: pwsh
        run: |
          $pins = Get-Content build/pins.json | ConvertFrom-Json
          "LKL_COMMIT=$($pins.lkl.commit)"      | Out-File $env:GITHUB_ENV -Append
          "LKL_REPO=$($pins.lkl.repository)"    | Out-File $env:GITHUB_ENV -Append
          "DOKANY_TAG=$($pins.dokany.tag)"      | Out-File $env:GITHUB_ENV -Append
          "DOKANY_VERSION=$($pins.dokany.version)" | Out-File $env:GITHUB_ENV -Append

      # MSYSTEM=MSYS, not MINGW64: LKL's build expects the MSYS environment.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: gcc make bc flex bison python diffutils git tar unzip

      - name: Fetch Dokany's headers and library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/include, vendor/lib | Out-Null
          $base = "https://raw.githubusercontent.com/dokan-dev/dokany/$env:DOKANY_TAG"
          # The headers are not in the installer; they come from the tag. They
          # include each other by plain name, so they go flat into include/.
          Invoke-WebRequest "$base/dokan/dokan.h"    -OutFile vendor/include/dokan.h
          Invoke-WebRequest "$base/dokan/fileinfo.h" -OutFile vendor/include/fileinfo.h
          Invoke-WebRequest "$base/sys/public.h"     -OutFile vendor/include/public.h

          # dokan2.dll is handed to the linker as a file, so no import library is
          # needed. The DRIVER is not redistributed: the user installs Dokany,
          # whose dokan2.sys is signed by Microsoft. See ATTRIBUTION.md.
          $sdk = "DokanLibrary-$env:DOKANY_VERSION.zip"
          Invoke-WebRequest "https://github.com/dokan-dev/dokany/releases/download/$env:DOKANY_TAG/$sdk" -OutFile $sdk
          Expand-Archive $sdk -DestinationPath sdk -Force
          $dll = Get-ChildItem sdk -Recurse -Filter dokan2.dll |
                 Where-Object { $_.FullName -notmatch 'ARM|x86|Debug' } |
                 Select-Object -First 1
          if (-not $dll) { throw "no x64 release dokan2.dll in $sdk; see build/pins.json" }
          Copy-Item $dll.FullName vendor/lib/dokan2.dll
          Get-FileHash vendor/lib/dokan2.dll, vendor/include/dokan.h -Algorithm SHA256 |
            Select-Object Hash, Path | Format-List

      - name: Clone LKL at the pinned commit
        run: |
          git init --quiet lkl
          cd lkl
          git remote add origin "$LKL_REPO"
          git fetch --depth 1 --quiet origin "$LKL_COMMIT"
          git checkout --quiet FETCH_HEAD
          echo "LKL at $(git rev-parse HEAD)"

      - name: Teach LKL to pass a flush through to the disk
        run: |
          # Three faults, each of which silently lost every "save now"
          # (docs/0c-step1-flush-proof.md). The patch refuses to apply if the
          # upstream code has moved, rather than patching the wrong thing.
          python patches/apply_virtio_blk_flush.py --tree lkl

      - name: Build
        run: bash build/build.sh

      - name: Checksums
        run: |
          cd out
          sha256sum ext4win.exe msys-2.0.dll | tee SHA256SUMS
          ./ext4win.exe 2>&1 | head -5 || true   # prints its usage and exits 2

      - uses: actions/upload-artifact@v4
        with:
          name: ext4win-windows-x64
          path: out/
          if-no-files-found: error
